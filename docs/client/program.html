<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Program</title>
  <link rel="stylesheet" href="../open-color.css" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html" class="back-link">← Programs</a>
      <span class="label" id="role-label"></span>
      <h1 id="program-title"></h1>
      <p id="program-meta"></p>
    </div>
  </header>

  <main>
    <div id="workout-slots"></div>

    <div class="mark-done-footer">
      <button id="program-done-btn" class="btn-mark-done btn-mark-done--inline" type="button"></button>
    </div>
  </main>

  <div id="edit-modal-overlay" class="view-modal-overlay" hidden>
    <div class="view-modal">
      <button id="edit-modal-close" class="modal-close-btn">✕</button>
      <h2>Edit Workout</h2>
      <form id="edit-modal-form">
        <div class="form-section">
          <label class="form-label" for="edit-title">Title</label>
          <input class="form-input" id="edit-title" type="text" required />
        </div>
        <div class="form-section">
          <label class="form-label" for="edit-notes">Notes <span class="optional">(optional)</span></label>
          <textarea class="form-input form-textarea" id="edit-notes" rows="3"></textarea>
        </div>
        <div class="form-section">
          <label class="form-label">Weekly RPE</label>
          <div class="per-week-rows" id="edit-rpe-rows"></div>
        </div>
        <button type="button" class="btn-add-workout" id="edit-show-warmup-btn">+ Add Warmup</button>
        <div class="workout-section-box" id="edit-warmup-box" hidden>
          <div class="workout-section-title">Warmup</div>
          <div class="form-section">
            <label class="form-label" for="edit-warmup-default-sets">Default sets <span class="optional">(optional)</span></label>
            <input class="form-input" id="edit-warmup-default-sets" type="number" min="1" placeholder="e.g. 1" />
          </div>
          <div class="form-section">
            <label class="form-label">Exercises <span class="optional">(optional)</span></label>
            <div id="edit-warmup-exercise-rows"></div>
            <button type="button" class="btn-add" id="edit-add-warmup-exercise">+ Add Warmup Exercise</button>
          </div>
        </div>
        <div class="workout-section-box">
          <div class="workout-section-title">Workout</div>
          <div class="form-section">
            <label class="form-label" for="edit-default-sets">Default sets</label>
            <input class="form-input" id="edit-default-sets" type="number" min="1" placeholder="e.g. 3" required />
          </div>
          <div class="form-section">
            <label class="form-label">Exercises</label>
            <div id="edit-exercise-rows"></div>
            <button type="button" class="btn-add" id="edit-add-exercise">+ Add Exercise</button>
          </div>
        </div>
        <button type="button" class="btn-add-workout" id="edit-show-cooldown-btn">+ Add Cooldown</button>
        <div class="workout-section-box" id="edit-cooldown-box" hidden>
          <div class="workout-section-title">Cooldown</div>
          <div class="form-section">
            <label class="form-label" for="edit-cooldown-default-sets">Default sets <span class="optional">(optional)</span></label>
            <input class="form-input" id="edit-cooldown-default-sets" type="number" min="1" placeholder="e.g. 1" />
          </div>
          <div class="form-section">
            <label class="form-label">Exercises <span class="optional">(optional)</span></label>
            <div id="edit-cooldown-exercise-rows"></div>
            <button type="button" class="btn-add" id="edit-add-cooldown-exercise">+ Add Cooldown Exercise</button>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn-save" type="submit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="program.js"></script>
</body>
</html>
