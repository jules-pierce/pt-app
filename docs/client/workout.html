<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout</title>
  <link rel="stylesheet" href="../open-color.css" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <a id="back-link" class="back-link">← Workouts</a>
      <span class="label">Workout</span>
      <h1 id="workout-title"></h1>
    </div>
  </header>

  <main>
    <section class="workout-notes" id="workout-notes-section">
      <p id="workout-notes"></p>
    </section>

    <div class="view-table-wrap view-table-wrap--scroll-fade">
      <div id="exercise-table"></div>
    </div>

    <div class="mark-done-footer">
      <button id="workout-done-btn" class="btn-mark-done btn-mark-done--inline" type="button"></button>
    </div>
  </main>

  <footer>
    <p>Built with <span>♥</span> for the grind</p>
  </footer>

  <script type="module" src="workout.js"></script>
</body>
</html>
