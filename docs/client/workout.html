<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html" class="back-link">← All Workouts</a>
      <span class="label">Workout</span>
      <h1 id="workout-title"></h1>
      <p id="workout-meta"></p>
    </div>
  </header>

  <main>
    <nav class="week-tabs" id="week-tabs"></nav>

    <section class="stats-bar">
      <div class="stat">
        <span class="stat-value" id="total-exercises">0</span>
        <span class="stat-label">Exercises</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="total-sets">0</span>
        <span class="stat-label">Total Sets</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="est-time">0 min</span>
        <span class="stat-label">Est. Time</span>
      </div>
    </section>

    <section class="workout-notes" id="workout-notes-section">
      <p id="workout-notes"></p>
    </section>

    <div class="exercise-list" id="exercise-list"></div>
  </main>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>

      <div class="modal-header">
        <div class="exercise-number" id="modal-number"></div>
        <div class="exercise-info">
          <div class="exercise-name" id="modal-name"></div>
          <div class="exercise-category" id="modal-category"></div>
        </div>
      </div>

      <div class="modal-prescription" id="modal-prescription"></div>

      <div class="modal-section">
        <label class="modal-label">Weights</label>
        <div id="modal-weights"></div>
      </div>

      <div class="modal-section">
        <label class="modal-label">Notes</label>
        <p class="modal-notes">example note</p>
      </div>

      <div class="modal-section">
        <label class="modal-label">Video</label>
        <video class="modal-video" src="videos/video.MOV" controls playsinline></video>
      </div>
    </div>
  </div>

  <footer>
    <p>Built with <span>♥</span> for the grind</p>
  </footer>

  <script src="workouts.js"></script>
  <script src="workout.js"></script>
</body>
</html>
