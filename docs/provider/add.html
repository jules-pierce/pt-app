<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider — Add Workout</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
<span class="label">Provider</span>
      <h1>Add Workout</h1>
    </div>
  </header>

  <main>
    <form id="workout-form">
      <div class="form-section">
        <label class="form-label" for="title">Title</label>
        <input class="form-input" id="title" type="text" placeholder="e.g. Upper Body Strength" required />
      </div>

<div class="form-section">
        <label class="form-label" for="notes">Notes <span class="optional">(optional)</span></label>
        <textarea class="form-input form-textarea" id="notes" placeholder="Coaching notes shown at the top of the workout…" rows="3"></textarea>
      </div>

      <div class="form-section">
        <div class="form-label-row">
          <label class="form-label">Exercises</label>
          <button type="button" class="btn-add" id="add-exercise">+ Add Exercise</button>
        </div>
        <div id="exercise-rows"></div>
      </div>

      <button class="btn-save" type="submit">Save Workout</button>
    </form>
  </main>

  <script src="provider.js"></script>
</body>
</html>
